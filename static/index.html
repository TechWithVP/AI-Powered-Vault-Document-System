<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vault Document System</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Vault</h1>
    <nav id="nav" class="tabs"></nav>
    <span class="spacer"></span>
    <input id="apiKey" class="key" type="text" placeholder="X-API-Key" autocomplete="off"
           aria-label="API key" />
    <span id="health" class="badge">checking...</span>
  </header>

  <main id="views"></main>

  <!-- Views are built in JavaScript, so markup and rendering live in one place
       rather than being split between a template and the code that fills it. -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
