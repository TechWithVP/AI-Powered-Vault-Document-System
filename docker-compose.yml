# =============================================================================
# AI-Powered Vault Document System - single-host stack.
# Runs identically on a local machine and on an EC2 instance:
#     docker compose up -d --build
# =============================================================================

x-app-env: &app-env
  env_file: [.env]
  environment:
    POSTGRES_HOST: postgres
    REDIS_HOST: redis
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://localstack:4566}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vault}
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vault}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vault} -d ${POSTGRES_DB:-vault}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vault-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional S3 emulator. Enable with:  docker compose --profile s3 up -d
  # Then set STORAGE_BACKEND=s3 in .env to exercise the AWS code path locally.
  localstack:
    image: localstack/localstack:3.8
    container_name: vault-localstack
    restart: unless-stopped
    profiles: ["s3"]
    environment:
      SERVICES: s3
      DEBUG: "0"
    volumes:
      - localstackdata:/var/lib/localstack
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q available"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Applies database migrations, then exits. Both app services wait for it.
  migrate:
    build:
      context: .
      target: development
    container_name: vault-migrate
    <<: *app-env
    command: ["alembic", "upgrade", "head"]
    # Migrations are mounted, like the application code, so a new revision
    # applies without rebuilding the image.
    volumes:
      - ./alembic:/srv/app/alembic
      - ./alembic.ini:/srv/app/alembic.ini
      - ./app:/srv/app/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: development
    container_name: vault-api
    restart: unless-stopped
    <<: *app-env
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    volumes:
      - documentdata:/srv/app/data
      - ./app:/srv/app/app
      - ./static:/srv/app/static
      - ./alembic:/srv/app/alembic
      - ./tests:/srv/app/tests
      - ./eval:/srv/app/eval
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    build:
      context: .
      target: development
    container_name: vault-worker
    restart: unless-stopped
    <<: *app-env
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2
      - --queues=ingestion,default
    volumes:
      - documentdata:/srv/app/data
      - ./app:/srv/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  pgdata:
  redisdata:
  localstackdata:
  documentdata:
